# Used only when the "postgres" profile is active (Phase 5):
#   set SPRING_PROFILES_ACTIVE=postgres
# Connection details come from environment variables. Never write the password in this file.
spring.datasource.url=jdbc:postgresql://${UQLAB_DB_HOST:localhost}:${UQLAB_DB_PORT:5432}/${UQLAB_DB_NAME:uqlab}
spring.datasource.username=${UQLAB_DB_USER:postgres}
spring.datasource.password=${UQLAB_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway builds and upgrades the schema from db/migration. Hibernate only CHECKS that the
# tables match the entities and refuses to start if they do not.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
