spring.application.name=uq-lab-backend
server.port=8080
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html

# Database: H2 stored in a file, so jobs survive a restart. The folder "data" is created next to
# the directory the application is started from, and is ignored by Git.
spring.datasource.url=jdbc:h2:file:./data/uqlab
spring.datasource.username=sa
spring.datasource.password=
# "update" creates the table on first start and adds missing columns later. Phase 5 replaces this
# with Flyway migrations on PostgreSQL.
spring.jpa.hibernate.ddl-auto=update
# Do not keep a database session open while the response is written.
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Security (Phase 4)
# The secret that signs login tokens (JWTs). Set the environment variable UQLAB_JWT_SECRET to a long
# random value of at least 32 characters. Never write the real secret in this file or commit it.
# If it is not set, a random key is made at every start, so everyone is signed out on restart.
uqlab.security.jwt-secret=${UQLAB_JWT_SECRET:}
# How long a login token stays valid, in minutes.
uqlab.security.token-ttl-minutes=60
