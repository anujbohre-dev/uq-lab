# Test configuration: replaces the main application.properties while tests run.
spring.application.name=uq-lab-backend-test
# In-memory database: fresh for every test run, nothing written to disk.
spring.datasource.url=jdbc:h2:mem:uqlab-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
