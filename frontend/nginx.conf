server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser talks to this one address. API calls are passed on to the backend container,
    # which Docker Compose makes reachable under the name "backend".
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /swagger-ui { proxy_pass http://backend:8080; }
    location /v3/api-docs { proxy_pass http://backend:8080; }

    # Any other path serves the single-page app.
    location / {
        try_files $uri /index.html;
    }
}
